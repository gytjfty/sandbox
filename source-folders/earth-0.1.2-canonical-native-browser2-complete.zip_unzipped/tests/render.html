<!doctype html><meta charset="utf-8"><title>Renderer regression harness</title><style>html,body{margin:0}canvas{width:100vw;height:100vh;display:block}</style><canvas id="view"></canvas><script type="module">
import {Renderer} from '../src/renderer.js';import {buildTree,R} from '../src/terrain.js';import {unit} from '../src/physics.js';window.r=new Renderer(document.querySelector('canvas'),text=>{window.failure=text;});window.ready=r.init();
window.compare=async function(ops,position=[0,R+8,20],direction=[0,-.25,-1]){await ready;const player={p:position,f:unit(direction)},bodies=Array.from({length:10},(_,i)=>({p:[i*5-22.5,R+3,-15],r:2})),previews=[{p:[0,R+5,-8],r:2,selected:true}];r.terrain(buildTree(ops),ops);const g=r.gl;function capture(mode){r.setTraversalMode(mode);g.finish();if(r.fence){g.deleteSync(r.fence);r.fence=null;}r.lastDraw=0;if(!r.draw(player,bodies,previews,performance.now()))throw Error('Draw did not submit');g.finish();const pixels=new Uint8Array(r.canvas.width*r.canvas.height*4);g.readPixels(0,0,r.canvas.width,r.canvas.height,g.RGBA,g.UNSIGNED_BYTE,pixels);if(g.getError()!==g.NO_ERROR)throw Error('Readback failed');return pixels;}const a=capture(false),b=capture(true);let different=0,maxDifference=0;for(let i=0;i<a.length;i++){const d=Math.abs(a[i]-b[i]);if(d)different++;maxDifference=Math.max(maxDifference,d);}return {components:a.length,different,maxDifference,tiles:r.tiles.stats,resolution:[r.canvas.width,r.canvas.height],error:r.error};};
</script>
