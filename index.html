<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planetary Simulation</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; font-family: sans-serif; }
    canvas { display: block; }
    #overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      color: #fff;
      font-family: sans-serif;
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      z-index: 100;
    }
    #overlay.hidden { display: none; }
    #status { margin-bottom: 10px; font-size: 14px; }
    #error { color: #ff4444; font-size: 13px; margin-bottom: 10px; }
    #controls { color: #aaa; font-size: 12px; margin-top: auto; }
    #menu {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: 24px;
      text-align: center;
      background: rgba(0,0,0,0.9);
      padding: 40px;
      border-radius: 8px;
      border: 2px solid #0f0;
      pointer-events: auto;
      display: none;
      z-index: 50;
    }
    #menu button {
      margin: 10px;
      padding: 15px 30px;
      font-size: 20px;
      cursor: pointer;
      background: #0f0;
      color: #000;
      border: none;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="overlay">
    <div id="status">Initializing...</div>
    <div id="error"></div>
    <div id="controls">
      WASD to move | Mouse to look | Esc to pause | +/- to adjust time speed
    </div>
  </div>
  <div id="menu">
    <h1>Planetary Simulation</h1>
    <p id="menu-status">Loading world...</p>
    <button id="start-btn">Start</button>
  </div>
  <!-- Three.js loaded from npm -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
